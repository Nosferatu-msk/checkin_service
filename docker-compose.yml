services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: checkin_postgres
    environment:
      POSTGRES_DB: checkin_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - checkin_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: checkin_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - checkin_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  server:
    build: ./server
    container_name: checkin_server
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_TOKEN_EXPIRATION: 15m
      JWT_REFRESH_TOKEN_EXPIRATION: 30d
    volumes:
      - ./jwt_public.pem:/run/secrets/jwt_public:ro
      - ./jwt_private.pem:/run/secrets/jwt_private:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - checkin_network
    restart: unless-stopped

  # Web Frontend
  web:
    build: ./web
    container_name: checkin_web
    ports:
      - "3001:80"
    depends_on:
      - server
    networks:
      - checkin_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  checkin_network:
    driver: bridge
