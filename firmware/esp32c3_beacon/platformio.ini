; PlatformIO Project Configuration File
; ESP32-C3 Super Mini BLE Beacon
;
; Build: platformio run
; Upload: platformio run --target upload
; Monitor: platformio run --target monitor
; Full: platformio run --target upload && platformio run --target monitor

[env:esp32-c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

; USB settings for ESP32-C3 Super Mini
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER

; NimBLE library (low-memory BLE stack)
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

; Upload settings
upload_speed = 460800
monitor_speed = 115200

; Partition table (minimal SPIFFS for NVS)
board_build.partitions = min_spiffs.csv

; Optimization
build_type = release

[env:esp32-c3-debug]
extends = env:esp32-c3
build_type = debug
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEBUG_BEACON=1
