<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#F9FAFB" />
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad1)" stroke-width="2" />
  
  <!-- Map Pin (professional, geometric) -->
  <path d="M100 35 L130 65 L130 95 C130 115, 115 130, 100 130 C85 130, 70 115, 70 95 L70 65 Z" 
        fill="url(#grad1)" opacity="0.95" />
  
  <!-- Inner circle for checkmark -->
  <circle cx="100" cy="80" r="22" fill="white" />
  
  <!-- Checkmark (precise, geometric) -->
  <path d="M88 80 L96 88 L112 72" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Gear (professional, 12 teeth, precise) -->
  <g transform="translate(100, 145)">
    <!-- Gear body -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#065F46" stroke-width="2.5" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#065F46" stroke-width="2.5" />
    
    <!-- Gear teeth (12 teeth, evenly spaced) -->
    <g stroke="#065F46" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-21" x2="0" y2="-25" />
      <line x1="10.5" y1="-18.2" x2="12.1" y2="-21.7" />
      <line x1="18.2" y1="-10.5" x2="21.7" y2="-12.1" />
      <line x1="21" y1="0" x2="25" y2="0" />
      <line x1="18.2" y1="10.5" x2="21.7" y2="12.1" />
      <line x1="10.5" y1="18.2" x2="12.1" y2="21.7" />
      <line x1="0" y1="21" x2="0" y2="25" />
      <line x1="-10.5" y1="18.2" x2="-12.1" y2="21.7" />
      <line x1="-18.2" y1="10.5" x2="-21.7" y2="12.1" />
      <line x1="-21" y1="0" x2="-25" y2="0" />
      <line x1="-18.2" y1="-10.5" x2="-21.7" y2="-12.1" />
      <line x1="-10.5" y1="-18.2" x2="-12.1" y2="-21.7" />
    </g>
  </g>
  
  <!-- Subtle shadow -->
  <ellipse cx="100" cy="175" rx="40" ry="3" fill="#000000" opacity="0.08" />
</svg>
