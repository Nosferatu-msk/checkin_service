             L17,-140 L23,-123 L40,-123 L46,-106 L63,-106 L69,-89 L86,-89 L92,-72 L109,-72 L115,-55 L132,-55 L138,-38 L143,-20 L143,0 
             L138,17 L132,34 L115,34 L109,51 L92,51 L86,68 L69,68 L63,85 L46,85 L40,102 L23,102 L17,119 L0,119 
