<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenPinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="45" fill="white" />
  
  <!-- Map Pin with green gradient -->
  <path d="M100 25 C130 25, 150 50, 150 80 C150 115, 100 145, 100 145 C100 145, 50 115, 50 80 C50 50, 70 25, 100 25 Z" 
        fill="url(#greenPinGradient)" />
  
  <!-- Inner circle for checkmark -->
  <circle cx="100" cy="75" r="28" fill="rgba(255,255,255,0.15)" />
  
  <!-- Checkmark -->
  <path d="M85 75 L95 85 L115 65" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Gear (outline style, 12 teeth) -->
  <g transform="translate(100, 155)">
    <!-- Outer gear path with teeth -->
    <path d="M0,-25 
             L3,-25 L4,-22 L7,-22 L8,-19 L11,-19 L12,-16 L15,-16 L16,-13 L19,-13 L20,-10 L23,-10 L24,-7 L25,-4 L25,0 
             L24,3 L23,6 L20,6 L19,9 L16,9 L15,12 L12,12 L11,15 L8,15 L7,18 L4,18 L3,21 L0,21 
             L-3,21 L-4,18 L-7,18 L-8,15 L-11,15 L-12,12 L-15,12 L-16,9 L-19,9 L-20,6 L-23,6 L-24,3 L-25,0 
             L-24,-4 L-23,-7 L-20,-7 L-19,-10 L-16,-10 L-15,-13 L-12,-13 L-11,-16 L-8,-16 L-7,-19 L-4,-19 L-3,-22 L0,-25 Z" 
          fill="none" stroke="#065F46" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#065F46" stroke-width="2.5" />
    
    <!-- Center hole -->
    <circle cx="0" cy="0" r="6" fill="white" stroke="#065F46" stroke-width="2" />
  </g>
</svg>
