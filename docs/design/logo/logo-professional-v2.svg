<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="#F8FAFC" />
  
  <!-- Abstract location marker (modern, geometric) -->
  <g transform="translate(100, 85)">
    <!-- Outer shape -->
    <path d="M0 -45 L35 -10 L35 25 C35 45, 20 60, 0 60 C-20 60, -35 45, -35 25 L-35 -10 Z" 
          fill="url(#blueGrad)" opacity="0.9" />
    
    <!-- Inner highlight -->
    <path d="M0 -35 L25 -5 L25 20 C25 35, 15 45, 0 45 C-15 45, -25 35, -25 20 L-25 -5 Z" 
          fill="white" opacity="0.15" />
    
    <!-- Checkmark -->
    <circle cx="0" cy="5" r="18" fill="white" />
    <path d="M-10 5 L-4 11 L10 -3" stroke="#10B981" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Technical element (circuit/gear hybrid) -->
  <g transform="translate(100, 155)">
    <!-- Central circle -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#0F172A" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#0F172A" />
    
    <!-- Connection points -->
    <circle cx="0" cy="-20" r="3" fill="#0F172A" />
    <circle cx="17.3" cy="-10" r="3" fill="#0F172A" />
    <circle cx="17.3" cy="10" r="3" fill="#0F172A" />
    <circle cx="0" cy="20" r="3" fill="#0F172A" />
    <circle cx="-17.3" cy="10" r="3" fill="#0F172A" />
    <circle cx="-17.3" cy="-10" r="3" fill="#0F172A" />
    
    <!-- Connection lines -->
    <g stroke="#0F172A" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-15" x2="0" y2="-17" />
      <line x1="13" y1="-7.5" x2="14.7" y2="-8.7" />
      <line x1="13" y1="7.5" x2="14.7" y2="8.7" />
      <line x1="0" y1="15" x2="0" y2="17" />
      <line x1="-13" y1="7.5" x2="-14.7" y2="8.7" />
      <line x1="-13" y1="-7.5" x2="-14.7" y2="-8.7" />
    </g>
  </g>
  
  <!-- Subtle grid pattern (technical feel) -->
  <g stroke="#E2E8F0" stroke-width="0.5" opacity="0.3">
    <line x1="20" y1="20" x2="180" y2="20" />
    <line x1="20" y1="40" x2="180" y2="40" />
    <line x1="20" y1="60" x2="180" y2="60" />
    <line x1="20" y1="160" x2="180" y2="160" />
    <line x1="20" y1="180" x2="180" y2="180" />
    <line x1="20" y1="20" x2="20" y2="180" />
    <line x1="40" y1="20" x2="40" y2="180" />
    <line x1="160" y1="20" x2="160" y2="180" />
    <line x1="180" y1="20" x2="180" y2="180" />
  </g>
</svg>
